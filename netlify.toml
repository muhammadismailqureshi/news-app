[build]
  base = "."
  publish = "frontend/build"
  command = "cd frontend && npm install && npm run build"

[build.environment]
  NODE_VERSION = "18.0.0"
  NPM_VERSION = "9.0.0"
  CI = "false"  # This prevents builds from failing due to warnings

[dev]
  command = "cd frontend && npm start"
  port = 3000
  publish = "frontend/build"
  targetPort = 3000
