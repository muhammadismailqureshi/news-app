services:
  - type: web
    name: news-app-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromDatabase:
          name: newsapp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEWS_API_KEY
        sync: false  # You'll need to set this in the Render dashboard
    plan: free
