[build]
  base = "."
  publish = "frontend/build"
  command = "cd frontend && npm install && npm run build"

[build.environment]
  NODE_VERSION = "20.5.0"
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_OPTIONS = "--openssl-legacy-provider"
  CI = "false"

[dev]
  command = "cd frontend && npm start"
  port = 3000
  publish = "frontend/build"
  targetPort = 3000
